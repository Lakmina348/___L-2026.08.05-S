<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Shop Scanner - Lakmina King👑️</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f19;
    color: #f3f4f6;
}

.header {
    background: linear-gradient(135deg, #1565c0, #00ffcc);
    color: #000;
    padding: 22px 16px;
    text-align: center;
    border-radius: 0 0 25px 25px;
    position: relative;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    cursor: pointer;
}

.header p {
    margin: 7px 0 0;
    font-weight: bold;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

.card {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 5px 18px rgba(0,0,0,.3);
}

#reader {
    width: 100%;
    overflow: hidden;
    border-radius: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.scanBtn {
    background: #1565c0;
    color: white;
    width: 100%;
}

.stopBtn {
    background: #e53935;
    color: white;
    width: 100%;
}

.pdfBtn {
    background: #2e7d32;
    color: white;
    width: 100%;
}

.clearBtn {
    background: #374151;
    color: #fff;
    width: 100%;
}

.adminBtn {
    background: #00ffcc;
    color: #000;
    width: 100%;
    margin-bottom: 10px;
}

.input-field {
    width: 100%;
    padding: 12px;
    background: #060913;
    border: 1px solid #1f2937;
    border-radius: 10px;
    color: #f3f4f6;
    margin-top: 8px;
    margin-bottom: 12px;
    font-size: 14px;
}

#message {
    margin-top: 12px;
    padding: 11px;
    border-radius: 10px;
    display: none;
    font-weight: bold;
}

.error {
    background: #ffebee;
    color: #c62828;
    display: block !important;
}

.success {
    background: #e8f5e9;
    color: #2e7d32;
    display: block !important;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 5px;
    border-bottom: 1px solid #1f2937;
}

.item:last-child {
    border-bottom: none;
}

.itemName {
    font-weight: bold;
    color: #00ffcc;
}

.itemCode {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 3px;
}

.price {
    text-align: right;
    font-weight: bold;
}

.qty {
    color: #9ca3af;
    font-size: 14px;
}

.totalBox {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
    padding-top: 15px;
    border-top: 2px solid #1f2937;
    font-size: 21px;
    font-weight: bold;
    color: #00ffcc;
}

.empty {
    text-align: center;
    color: #9ca3af;
    padding: 20px;
}

/* Modal for Admin Login */
.modal {
    display: none;
    position: fixed;
    z-index: 100;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
}
.modal-content {
    background: #111827;
    padding: 25px;
    border-radius: 15px;
    width: 90%;
    max-width: 400px;
    border: 1px solid #00ffcc;
}
</style>
</head>

<body>

<div class="header">
    <!-- 🛒 ඉමෝජිය ක්ලික් කළ විට 1.html වෙත යයි -->
    <h1 onclick="goToAdminPage()" style="cursor: pointer;" title="1.html වෙත යන්න">🛒 Smart Shop Scanner</h1>
    <p>Lakmina King👑️ සඳහා වන පද්ධතිය</p>
</div>

<div class="container">

    <div class="card">
        <h3>📷 Barcode Scanner</h3>

        <div id="reader"></div>

        <button class="scanBtn" onclick="startScanner()">
            📷 Scan Barcode
        </button>

        <button class="stopBtn" onclick="stopScanner()">
            ⛔ Stop Scanner
        </button>

        <div id="message"></div>
    </div>

    <div class="card">
        <h3>🛍️ භාණ්ඩ ලැයිස්තුව</h3>

        <div id="items">
            <div class="empty">
                තවම භාණ්ඩයක් scan කරලා නැහැ.
            </div>
        </div>

        <div class="totalBox">
            <span>Total</span>
            <span id="total">Rs. 0.00</span>
        </div>
    </div>

    <div class="card">
        <button class="pdfBtn" onclick="generatePDF()">
            📄 සාරාංශය PDF කරන්න
        </button>

        <button class="clearBtn" onclick="clearCart()">
            🗑️ සියල්ල ඉවත් කරන්න
        </button>
    </div>

</div>

<!-- Admin Login / Add Product Modal (1.html වෙනුවට ක්‍රියාත්මක වන අභ්‍යන්තර පැනලය) -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3 style="color: #00ffcc; margin-top:0;">🔒 පරිපාලක ප්‍රවේශය (1.html)</h3>
        <p style="font-size: 13px; color: #9ca3af;">භාණ්ඩ එකතු කිරීමට රහස් අංකය (උපන්දිනය: 2006.08.05) ඇතුළත් කරන්න.</p>
        
        <label style="font-size: 13px;">රහස් අංකය (Password)</label>
        <input type="password" id="adminPassword" class="input-field" placeholder="Password දෙන්න">

        <button class="adminBtn" onclick="checkAdminPassword()">ඇතුල් වන්න</button>
        <button class="clearBtn" onclick="closeModal()" style="width:100%;">වසන්න</button>
    </div>
</div>

<!-- Add New Product Panel (ප්‍රවේශ වූ පසු පෙනෙන කොටස) -->
<div id="addProductModal" class="modal">
    <div class="modal-content" style="max-width: 450px;">
        <h3 style="color: #00ffcc; margin-top:0;">➕ අලුත් භාණ්ඩයක් එකතු කරන්න</h3>
        
        <label style="font-size: 13px;">Barcode අංකය</label>
        <input type="text" id="newBarcode" class="input-field" placeholder="උදා: 4791234567892">

        <label style="font-size: 13px;">භාණ්ඩයේ නම (Name)</label>
        <input type="text" id="newName" class="input-field" placeholder="භාණ්ඩයේ නම ලියන්න">

        <label style="font-size: 13px;">මිල (Price)</label>
        <input type="number" id="newPrice" class="input-field" placeholder="මිල ගණන් ලියන්න">

        <button class="adminBtn" onclick="saveNewProduct()">භාණ්ඩය සුරකින්න</button>
        <button class="clearBtn" onclick="closeAddProductModal()" style="width:100%;">ඉවත් වන්න</button>
    </div>
</div>

<script>

/*
========================================
PRODUCT DATABASE (Local Storage සමඟ සම්බන්ධ කර ඇත)
========================================
*/

let defaultProducts = {
    "4791234567890": { name: "Coca Cola 500ml", price: 250 },
    "4791234567891": { name: "Milk Powder 400g", price: 980 },
    "4791234567892": { name: "Biscuits", price: 180 },
    "4791234567893": { name: "Rice 1kg", price: 250 },
    "4791234567894": { name: "Soap", price: 150 }
};

// LocalStorage වෙතින් නිෂ්පාදන ලබා ගැනීම (නැතහොත් default ඒවා පාවිච්චි කිරීම)
let products = JSON.parse(localStorage.getItem('lakmina_shop_products')) || defaultProducts;

let cart = {};
let scanner = null;
let scanning = false;

// 🛒 ඉමෝජිය ක්ලික් කළ විට ක්‍රියාත්මක වන ෆන්ක්ෂන් එක (1.html වෙත යොමු කිරීම හෝ ලොගින් වීම)
function goToAdminPage() {
    // ඔබට අවශ්‍ය නම් මෙතැනින් වෙනස් කර 1.html වෙත යා හැක: window.location.href = "1.html";
    // පහත දැක්වෙන්නේ ආරක්ෂිත පාස්වර්ඩ් එක (2006.08.05) මඟින් ඇතුළු වන ක්‍රමයයි:
    document.getElementById('adminModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('adminModal').style.display = 'none';
}

function closeAddProductModal() {
    document.getElementById('addProductModal').style.display = 'none';
}

function checkAdminPassword() {
    const pwd = document.getElementById('adminPassword').value.trim();
    // ඔබ ඉල්ලා සිටි පරිදි රහස් අංකය 2006.08.05 වේ
    if (pwd === "2006.08.05") {
        closeModal();
        document.getElementById('adminPassword').value = "";
        document.getElementById('addProductModal').style.display = 'flex';
    } else {
        alert("වැරදි රහස් අංකයක්! කරුණාකර නැවත උත්සාහ කරන්න.");
    }
}

// අලුත් භාණ්ඩයක් සේව් කිරීමේ ෆන්ක්ෂන් එක
function saveNewProduct() {
    const barcode = document.getElementById('newBarcode').value.trim();
    const name = document.getElementById('newName').value.trim();
    const price = parseFloat(document.getElementById('newPrice').value);

    if (!barcode || !name || isNaN(price)) {
        alert("කරුණාකර සියලුම විස්තර නිවැරදිව පුරවන්න!");
        return;
    }

    // ඩේටාබේස් එකට එකතු කිරීම
    products[barcode] = {
        name: name,
        price: price
    };

    // LocalStorage එකේ සේව් කිරීම (රීසෙට් වුවද මැකී නොයෑමට)
    localStorage.setItem('lakmina_shop_products', JSON.stringify(products));

    alert("✅ භාණ්ඩය සාර්ථකව සුරකින ලදී!");
    document.getElementById('newBarcode').value = "";
    document.getElementById('newName').value = "";
    document.getElementById('newPrice').value = "";
    closeAddProductModal();
}

function showMessage(text, type) {
    const msg = document.getElementById("message");
    msg.innerText = text;
    msg.className = "";
    msg.classList.add(type);
}

function startScanner() {
    if (scanning) {
        showMessage("Scanner එක දැනටමත් වැඩ කරනවා.", "error");
        return;
    }

    scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        function(decodedText) {
            handleBarcode(decodedText);
        },
        function(errorMessage) {}
    ).then(() => {
        scanning = true;
        showMessage("📷 Barcode එක camera එක ඉදිරියට ගන්න.", "success");
    }).catch(error => {
        showMessage("Camera එක open කරන්න බැහැ. Browser permission check කරන්න.", "error");
    });
}

function stopScanner() {
    if (!scanner || !scanning) {
        return;
    }
    scanner.stop().then(() => {
        scanning = false;
        showMessage("Scanner එක නවත්වන ලදී.", "success");
    }).catch(() => {});
}

function handleBarcode(barcode) {
    barcode = String(barcode).trim();

    if (!products[barcode]) {
        showMessage("❌ මේ Barcode එකට භාණ්ඩයක් හමු වුණේ නැහැ: " + barcode, "error");
        if (navigator.vibrate) { navigator.vibrate(200); }
        return;
    }

    if (cart[barcode]) {
        cart[barcode].qty++;
    } else {
        cart[barcode] = {
            name: products[barcode].name,
            price: products[barcode].price,
            qty: 1
        };
    }

    showMessage("✅ " + products[barcode].name + " එකතු කළා!", "success");

    if (navigator.vibrate) { navigator.vibrate(100); }

    renderCart();
}

function renderCart() {
    const itemsDiv = document.getElementById("items");
    itemsDiv.innerHTML = "";
    let total = 0;
    const keys = Object.keys(cart);

    if (keys.length === 0) {
        itemsDiv.innerHTML = `<div class="empty">තවම භාණ්ඩයක් scan කරලා නැහැ.</div>`;
        document.getElementById("total").innerText = "Rs. 0.00";
        return;
    }

    keys.forEach(barcode => {
        const item = cart[barcode];
        const subtotal = item.price * item.qty;
        total += subtotal;

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
            <div>
                <div class="itemName">${item.name}</div>
                <div class="itemCode">Barcode: ${barcode}</div>
                <div class="qty">Qty: ${item.qty}</div>
            </div>
            <div class="price">Rs. ${subtotal.toFixed(2)}</div>
        `;
        itemsDiv.appendChild(div);
    });

    document.getElementById("total").innerText = "Rs. " + total.toFixed(2);
}

function generatePDF() {
    const keys = Object.keys(cart);
    if (keys.length === 0) {
        showMessage("❌ PDF එකක් හදන්න කලින් භාණ්ඩයක් scan කරන්න.", "error");
        return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(20);
    doc.text("SHOPPING SUMMARY - LAKMINA SHOP", 105, 20, { align: "center" });

    doc.setFontSize(10);
    const date = new Date();
    doc.text("Date: " + date.toLocaleString(), 15, 30);

    let y = 45;
    doc.setFontSize(12);
    doc.text("Item", 15, y);
    doc.text("Qty", 120, y);
    doc.text("Price", 145, y);
    doc.text("Total", 175, y);

    doc.line(15, y + 3, 195, y + 3);
    y += 12;

    let grandTotal = 0;

    keys.forEach(barcode => {
        const item = cart[barcode];
        const subtotal = item.price * item.qty;
        grandTotal += subtotal;

        doc.setFontSize(10);
        doc.text(item.name.substring(0, 35), 15, y);
        doc.text(String(item.qty), 120, y);
        doc.text("Rs. " + item.price.toFixed(2), 145, y);
        doc.text("Rs. " + subtotal.toFixed(2), 175, y);
        y += 10;

        if (y > 270) {
            doc.addPage();
            y = 20;
        }
    });

    doc.line(15, y + 2, 195, y + 2);
    y += 15;
    doc.setFontSize(16);
    doc.text("GRAND TOTAL: Rs. " + grandTotal.toFixed(2), 105, y, { align: "center" });

    y += 15;
    doc.setFontSize(10);
    doc.text("Thank you!", 105, y, { align: "center" });

    doc.save("shopping-summary-" + Date.now() + ".pdf");
    showMessage("✅ PDF එක සාර්ථකව සකස් කළා!", "success");
}

function clearCart() {
    if (!confirm("සියලුම භාණ්ඩ ඉවත් කරන්නද?")) { return; }
    cart = {};
    renderCart();
    showMessage("🗑️ සියලුම භාණ්ඩ ඉවත් කළා.", "success");
}
</script>

</body>
</html>
